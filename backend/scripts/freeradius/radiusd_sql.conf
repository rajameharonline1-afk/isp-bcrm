# ফাইল: backend/scripts/freeradius/radiusd_sql.conf
# এই ফাইলটি FreeRADIUS-এর SQL module configuration।
# /etc/freeradius/3.0/mods-available/sql ফাইলে এই configuration দিতে হবে।

sql {
    # PostgreSQL ব্যবহার করা হচ্ছে
    driver = "rlm_sql_postgresql"

    # Database connection তথ্য
    server = "localhost"
    port = 5432
    login = "radius_user"
    # password = "your_radius_db_password"  # production-এ পরিবর্তন করুন
    radius_db = "radius"

    # Table names
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    groupcheck_table = "radgroupcheck"
    authreply_table = "radreply"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"

    # User-কে group থেকে delete করার পরিবর্তে override করা
    delete_stale_sessions = yes

    # Connection pool settings
    pool {
        start = ${thread[pool].start_servers}
        min = ${thread[pool].min_spare_servers}
        max = ${thread[pool].max_servers}
        spare = ${thread[pool].max_spare_servers}
        uses = 0
        retry_delay = 30
        lifetime = 0
        idle_timeout = 60
    }

    # Read queries
    read_clients = yes
    client_table = "nas"
}
